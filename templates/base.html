<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ComplaintDesk{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    {% block extra_head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">{% endblock %}
</head>
<body class="app-body">
    <div id="toast"></div>
    {% block body %}{% endblock %}

    
    {% block scripts %}
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>{% endblock %}
</body>
</html>
